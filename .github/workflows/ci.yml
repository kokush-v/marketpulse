name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install backend dependencies
        working-directory: backend
        run: make sync

      - name: Run backend Ruff checks
        working-directory: backend
        run: make lint

      - name: Run backend unit tests
        working-directory: backend
        run: make test-unit

  ai-eval:
    name: AI assistant evals
    if: github.event_name == 'pull_request' && github.base_ref == 'dev'
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      # Production assistant model; ASSISTANT_EVAL_GROQ_MODEL overrides it for the evals.
      GROQ_MODEL: openai/gpt-oss-120b
      ASSISTANT_EVAL_GROQ_MODEL: ${{ vars.ASSISTANT_EVAL_GROQ_MODEL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install backend dependencies
        working-directory: backend
        run: make sync

      - name: Run AI assistant evals
        working-directory: backend
        run: make test-ai-eval

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install backend dependencies
        working-directory: backend
        run: make sync

      - name: Export backend OpenAPI schema
        working-directory: backend
        run: uv run python -c "import json; from app.main import app; print(json.dumps(app.openapi()))" > ../frontend/marketpulse-openapi.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate frontend API client
        working-directory: frontend
        env:
          MARKETPULSE_OPENAPI_URL: ./marketpulse-openapi.json
        run: npm run generate:api

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Run frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test -- --runInBand

      - name: Run frontend build
        working-directory: frontend
        run: npm run build
