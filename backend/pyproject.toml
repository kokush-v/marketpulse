[project]
name = "marketpulse-backend"
version = "0.1.0"
description = "MarketPulse backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "sqlalchemy>=2.0.30",
  "greenlet>=3.1.1",
  "asyncpg>=0.29.0",
  "alembic>=1.13.0",
  "email-validator>=2.2.0",
  "pydantic-settings>=2.3.0",
  "PyJWT>=2.10.0",
  "supabase>=2.15.3",
]

[dependency-groups]
dev = [
  "ruff>=0.5.0",
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
