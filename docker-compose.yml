services:
  postgres:
    image: postgres:16-alpine
    container_name: marketpulse-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marketpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketpulse}
      POSTGRES_DB: ${POSTGRES_DB:-marketpulse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:16-alpine
    container_name: marketpulse-postgres-test
    profiles: ["test"]
    environment:
      POSTGRES_USER: ${POSTGRES_TEST_USER:-marketpulse}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-marketpulse}
      POSTGRES_DB: ${POSTGRES_TEST_DB:-marketpulse_test}
    ports:
      - "${POSTGRES_TEST_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
