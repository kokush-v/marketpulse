schema: spec-driven

context: |
  Project: MarketPulse, a web app for authenticated users to manage stock watchlists, view market data and company news, configure alert rules, and receive Telegram notifications and daily digests.
  MVP scope: one authenticated regular user role. All watchlists, symbols, alerts, Telegram settings, and notification history are user-scoped.
  Backend: Python, FastAPI, SQLAlchemy, Alembic, PostgreSQL, Pytest, Ruff, OpenAPI/Swagger.
  Frontend: Next.js 15+ App Router, TypeScript, TailwindCSS, shadcn/ui, TanStack Query, Zustand, React Hook Form, Zod, Axios, Recharts.
  Infrastructure: AWS Cognito, Docker, GitHub Actions, GitHub Container Registry, AWS ECS, AWS Secrets Manager, CloudWatch.
  Integrations: Finnhub API for market data/news; Telegram Bot API for notifications.
  Architecture: backend is the trusted boundary for auth, authorization, provider calls, caching, alert evaluation, and notification delivery.
  Security: derive ownership from the authenticated user and enforce row-level ownership in backend queries. Never expose provider API keys or Telegram bot tokens to the frontend.
  Data conventions: stock tickers are normalized to uppercase; prevent duplicate symbols inside a watchlist; prevent duplicate news articles by URL.
  OpenSpec domains: auth, watchlists, market-data, news, alerts, telegram, notifications, background-jobs.

rules:
  proposal:
    - Include non-goals when scope could expand.
    - Name affected domains and primary user workflows.
  specs:
    - Use RFC-style SHALL/SHOULD/MAY language.
    - Use Given/When/Then scenarios.
    - Keep requirements user-scoped unless explicitly stated otherwise.
  design:
    - Call out authorization, data ownership, provider failures, retries, and idempotency where relevant.
    - Prefer backend-owned provider integrations and caching over frontend direct calls.
  tasks:
    - Break work into independently verifiable backend, frontend, migration, integration, and test tasks.
    - Include focused tests for new backend behavior and explicit UI states for new frontend flows.
