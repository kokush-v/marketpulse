apiVersion: batch/v1
kind: CronJob
metadata:
  name: marketpulse-news-alert-evaluation
  namespace: marketpulse
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: marketpulse-news-alert-evaluation
        spec:
          restartPolicy: Never
          containers:
            - name: news-alert-evaluation
              image: marketpulse-cron:dev
              imagePullPolicy: IfNotPresent
              command:
                - python
                - -m
                - app.features.background_jobs.runner
                - --job
                - news
              envFrom:
                - configMapRef:
                    name: marketpulse-backend-config
                - secretRef:
                    name: marketpulse-backend-secrets
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
