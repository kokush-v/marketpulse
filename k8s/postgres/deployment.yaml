apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketpulse-postgres
  namespace: marketpulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: marketpulse-postgres
  template:
    metadata:
      labels:
        app: marketpulse-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: marketpulse
            - name: POSTGRES_DB
              value: marketpulse
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: marketpulse-postgres-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: marketpulse-postgres-data
